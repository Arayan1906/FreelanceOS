version: "3.9"
services: 
  db: 
    image: postgres:15 
    container_name: freelanceos_db
    environment: 
    POSTGRES_USER: freelancer 
    POSTGRES_PASSWORD: freelanceos123 
    POSTGRES_DB: freelanceos 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
  redis: 
    image: redis:7 
    container_name: freelanceos_redis 
    ports: 
    - "6379:6379"
  volumes: 
    postgres_data: